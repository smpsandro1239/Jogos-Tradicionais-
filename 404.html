<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogos Tradicionais - Plataforma</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; background: #f9fafb; color: #111827; }
        .card { background: white; padding: 2.5rem; border-radius: 1rem; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); max-width: 400px; width: 100%; text-align: center; }
        h1 { margin: 0 0 0.5rem; font-size: 1.5rem; color: #059669; }
        p { margin: 0 0 2rem; color: #6b7280; font-size: 0.95rem; }
        .btns { display: flex; flex-direction: column; gap: 1rem; }
        .btn { display: block; padding: 0.75rem; text-decoration: none; border-radius: 0.5rem; font-weight: 600; transition: opacity 0.2s; color: white; }
        .btn-green { background: #10b981; }
        .btn-orange { background: #f59e0b; }
        .btn:hover { opacity: 0.9; }
        .footer { margin-top: 2rem; font-size: 0.75rem; color: #9ca3af; border-top: 1px solid #f3f4f6; padding-top: 1rem; }
    </style>
</head>
<body>
    <div class="card">
        <div style="font-size: 3rem; margin-bottom: 1rem;">🐄</div>
        <h1>Jogos Tradicionais</h1>
        <p>Plataforma de Angariação de Fundos</p>
        <div class="btns">
            <a href="https://smpsandro1239.github.io/Jogos-Tradicionais-/" class="btn btn-green">📱 Aplicação (Jogadores)</a>
            <a href="https://jogos-tradicionais-backoffice.vercel.app/" class="btn btn-orange">🛠️ Painel de Gestão (Admin)</a>
        </div>
        <div class="footer">
            Se algum link não funcionar, consulte o README do projeto para configurar os domínios.
        </div>
    </div>
</body>
</html>
