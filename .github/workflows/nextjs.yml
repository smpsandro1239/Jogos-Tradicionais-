name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Seu build aqui (ex: para Flutter web, static, etc.)
      # - name: Build
      #   run: flutter build web --release --base-href /

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        # with: enablement: true   # Só se não ativou na UI

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/mobile/web   # ou build/web, ajuste pro seu caso

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
