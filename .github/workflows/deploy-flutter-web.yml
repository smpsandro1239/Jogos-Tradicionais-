name: Deploy Flutter Web to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'  # garante Dart 3.5+ para teu ^3.10.7
          channel: 'stable'

      - name: Flutter version debug
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get
        working-directory: frontend/mobile

      - name: Build Flutter Web
        run: flutter build web --release --base-href "/Jogos-Tradicionais-/"
        working-directory: frontend/mobile

      - name: List build output (debug)
        run: ls -la frontend/mobile/build/web

      - name: Add .nojekyll
        run: touch frontend/mobile/build/web/.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/mobile/build/web
