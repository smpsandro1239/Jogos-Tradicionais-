name: Deploy Flutter Web to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.10.x'   # compatível com teu sdk: ^3.10.7
          channel: 'stable'

      - name: Install Flutter dependencies
        run: flutter pub get
        working-directory: frontend/mobile

      - name: Build Flutter for Web
        run: flutter build web --release --base-href "/Jogos-Tradicionais-/"   # importante: ajusta ao nome do repo!
        working-directory: frontend/mobile

      - name: Add .nojekyll (evita conflitos com Jekyll)
        run: touch frontend/mobile/build/web/.nojekyll

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/mobile/build/web   # isso sobe o build completo com index.html + JS + assets

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
