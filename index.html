<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogos Tradicionais - Plataforma</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; background-color: #f0f4f8; color: #1a202c; }
        .container { text-align: center; padding: 2.5rem; background: white; border-radius: 1rem; box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04); max-width: 450px; width: 90%; }
        .logo { font-size: 4rem; margin-bottom: 1rem; }
        h1 { color: #2d3748; margin: 0 0 0.5rem 0; font-size: 1.8rem; }
        p { color: #718096; margin-bottom: 2rem; font-size: 1rem; }
        .links { display: flex; flex-direction: column; gap: 1rem; }
        .button { padding: 0.875rem; text-decoration: none; border-radius: 0.5rem; color: white; font-weight: 600; transition: all 0.2s; display: block; text-transform: uppercase; letter-spacing: 0.025em; }
        .button:hover { filter: brightness(1.1); transform: translateY(-1px); }
        .button:active { transform: translateY(0); }
        .btn-app { background-color: #38a169; }
        .btn-admin { background-color: #d69e2e; }
        .footer { margin-top: 2.5rem; font-size: 0.75rem; color: #a0aec0; border-top: 1px solid #edf2f7; padding-top: 1rem; }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">🐄</div>
        <h1>Jogos Tradicionais</h1>
        <p>Plataforma de Angariação de Fundos</p>
        <div class="links">
            <!-- Os links abaixo serão corrigidos pelo utilizador nas definições de deploy se necessário -->
            <a href="/Jogos-Tradicionais-/" class="button btn-app">Entrar na Aplicação</a>
            <a href="https://jogos-tradicionais-backoffice.vercel.app/" class="button btn-admin">Painel de Administração</a>
        </div>
        <div class="footer">
            Desenvolvido para Aldeias e Comissões de Festas
        </div>
    </div>
</body>
</html>
